<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIGGA Corral — Generador de Códigos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #222636;
    --border: #2d3148; --accent: #e85500; --accent-light: #f5d080;
    --text: #e8e8e8; --text-dim: #6b7280; --green: #1e7a46; --red: #c0392b;
  }
  body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .panel { width: 100%; max-width: 520px; }
  .header { text-align: center; margin-bottom: 32px; }
  .logo { font-size: 28px; font-weight: 900; color: var(--accent); letter-spacing: 4px; }
  .logo-sub { font-size: 11px; color: var(--text-dim); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .badge { display: inline-block; background: var(--surface2); border: 1px solid var(--border); font-size: 10px; color: var(--text-dim); padding: 3px 10px; letter-spacing: 2px; margin-top: 8px; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 28px; margin-bottom: 16px; }
  .card-title { font-size: 10px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-bottom: 20px; font-weight: 700; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 10px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; }
  input, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 12px; font-family: 'Courier New', monospace; font-size: 14px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }
  .row { display: flex; gap: 12px; }
  .row .form-group { flex: 1; }
  .btn { display: block; width: 100%; padding: 14px; font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border: none; cursor: pointer; background: var(--accent); color: #000; margin-top: 4px; }
  .btn:active { filter: brightness(0.85); }
  .btn-secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .result-box { display: none; background: var(--surface2); border: 2px solid var(--accent); padding: 20px; text-align: center; }
  .result-label { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }
  .result-code { font-size: 22px; font-weight: 700; color: var(--accent-light); letter-spacing: 2px; word-break: break-all; margin-bottom: 12px; }
  .result-info { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin-bottom: 14px; }
  .result-info span { color: var(--text); font-weight: 700; }
  .copy-btn { background: var(--green); color: #fff; border: none; padding: 10px 24px; font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; }
  .copy-btn:active { filter: brightness(0.85); }
  .separator { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .verify-card { background: var(--surface); border: 1px solid var(--border); padding: 24px; }
  .verify-result { margin-top: 12px; padding: 12px; font-size: 12px; display: none; }
  .verify-ok { background: #0d2b1a; border: 1px solid var(--green); color: #5ae89c; }
  .verify-err { background: #2b0d0d; border: 1px solid var(--red); color: #e85a5a; }
  .footer-note { text-align: center; font-size: 10px; color: var(--text-dim); margin-top: 20px; letter-spacing: 1px; }

  /* History table */
  .history-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 12px; }
  .history-table th { text-align: left; padding: 6px 8px; font-size: 9px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .history-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 11px; }
  .history-table td:first-child { color: var(--accent-light); font-weight: 700; letter-spacing: 1px; }
  .clear-hist { font-size: 10px; color: var(--red); background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; letter-spacing: 1px; float: right; margin-top: -2px; }
</style>
</head>
<body>
<div class="panel">

  <div class="header">
    <div class="logo">TIGGA CORRAL</div>
    <div class="logo-sub">Panel de Activación</div>
    <div class="badge">⚙ Solo para administradores</div>
  </div>

  <!-- GENERATOR -->
  <div class="card">
    <div class="card-title">▸ Generar código de activación</div>
    <div class="row">
      <div class="form-group">
        <label>Código estancia (4 letras)</label>
        <input type="text" id="gEst" placeholder="ESPA" maxlength="4" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
      </div>
      <div class="form-group">
        <label>Nombre estancia</label>
        <input type="text" id="gNombre" placeholder="Estancia San Pedro">
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>Duración</label>
        <select id="gDuracion" onchange="updateFecha()">
          <option value="365">1 año (365 días)</option>
          <option value="730">2 años (730 días)</option>
          <option value="180">6 meses</option>
          <option value="90">3 meses (prueba)</option>
          <option value="30">1 mes (demo)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Vence el</label>
        <input type="date" id="gFecha">
      </div>
    </div>
    <button class="btn" onclick="generarCodigo()">GENERAR CÓDIGO</button>
  </div>

  <!-- RESULT -->
  <div class="result-box" id="resultBox">
    <div class="result-label">Código de activación</div>
    <div class="result-code" id="resultCode"></div>
    <div class="result-info" id="resultInfo"></div>
    <button class="copy-btn" onclick="copiarCodigo()">📋 Copiar código</button>
    &nbsp;
    <button class="copy-btn" onclick="copiarWhatsapp()" style="background:#075e54">💬 Mensaje WhatsApp</button>
  </div>

  <div class="separator"></div>

  <!-- VERIFY -->
  <div class="verify-card">
    <div class="card-title">▸ Verificar código</div>
    <div class="form-group">
      <label>Código a verificar</label>
      <input type="text" id="vCode" placeholder="FT-XXXXXX-XXXXXX-XXXX-XXXXXXXX-XXXX" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
    </div>
    <button class="btn btn-secondary" onclick="verificarCodigo()">VERIFICAR</button>
    <div class="verify-result" id="verifyResult"></div>
  </div>

  <div class="separator"></div>

  <!-- HISTORY -->
  <div class="card">
    <div class="card-title">
      ▸ Historial de códigos generados
      <button class="clear-hist" onclick="clearHistory()">Limpiar</button>
    </div>
    <div id="historyContainer"><div style="font-size:11px;color:var(--text-dim)">Sin códigos generados aún.</div></div>
  </div>

  <div class="footer-note">TIGGA Corral Admin — uso exclusivo interno</div>
</div>

<script>
const SECRET = "FT2025PY_k9x";
const GRACE_DAYS = 10;

// ── SHA-256 via SubtleCrypto ──────────────────────────────
async function sha256hex(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
}

// ── Set default fecha ─────────────────────────────────────
function updateFecha() {
  const days = parseInt(document.getElementById('gDuracion').value);
  const d = new Date();
  d.setDate(d.getDate() + days);
  document.getElementById('gFecha').value = d.toISOString().split('T')[0];
}
updateFecha();

// ── Generate ──────────────────────────────────────────────
async function generarCodigo() {
  const est = document.getElementById('gEst').value.trim().toUpperCase().padEnd(4,'X').slice(0,4);
  const nombre = document.getElementById('gNombre').value.trim();
  const fecha = document.getElementById('gFecha').value;
  if (!est || est.length < 2) { alert('Ingresá el código de estancia (2-4 letras)'); return; }
  if (!fecha) { alert('Seleccioná la fecha de vencimiento'); return; }

  const dateC = fecha.replace(/-/g,''); // YYYYMMDD
  const hashInput = `${est}|${dateC}|${SECRET}`;
  const h = await sha256hex(hashInput);
  const code = `FT-${h.slice(0,6)}-${h.slice(6,12)}-${h.slice(12,16)}-${dateC}-${est}`;

  // Show result
  document.getElementById('resultCode').textContent = code;
  const [y,m,d] = fecha.split('-');
  document.getElementById('resultInfo').innerHTML =
    `Estancia: <span>${nombre || est}</span> &nbsp;·&nbsp; Código: <span>${est}</span><br>` +
    `Vence: <span>${d}/${m}/${y}</span> &nbsp;·&nbsp; Grace: <span>+${GRACE_DAYS} días</span>`;
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('resultBox').scrollIntoView({behavior:'smooth', block:'nearest'});

  // Save to history
  saveHistory({ code, est, nombre: nombre||est, fecha, generado: new Date().toISOString() });
  renderHistory();
}

// ── Copy ──────────────────────────────────────────────────
function copiarCodigo() {
  const code = document.getElementById('resultCode').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✓ Copiado';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}

function copiarWhatsapp() {
  const code = document.getElementById('resultCode').textContent;
  const info = document.getElementById('resultInfo').innerText;
  const msg = `🐄 *TIGGA Corral — Código de activación*\n\n` +
    `${info}\n\n` +
    `📱 Tu código:\n*${code}*\n\n` +
    `Para activar: abrí TIGGA Corral → ingresá este código → listo.`;
  navigator.clipboard.writeText(msg).then(() => {
    const btn = event.target;
    btn.textContent = '✓ Copiado';
    setTimeout(() => btn.textContent = '💬 Mensaje WhatsApp', 2000);
  });
}

// ── Verify ────────────────────────────────────────────────
async function verificarCodigo() {
  const code = document.getElementById('vCode').value.trim().toUpperCase();
  const result = document.getElementById('verifyResult');
  const data = await decodeCode(code);
  result.style.display = 'block';
  if (!data) {
    result.className = 'verify-result verify-err';
    result.innerHTML = '✕ Código inválido o manipulado';
    return;
  }
  const [y,m,d] = data.vencimiento.split('-');
  const now = new Date(); now.setHours(0,0,0,0);
  const venc = new Date(data.vencimiento);
  const diffDays = Math.floor((venc - now) / 86400000);
  let estado = diffDays >= 0
    ? `<span style="color:#5ae89c">✓ Activo — vence en ${diffDays} días</span>`
    : diffDays >= -GRACE_DAYS
      ? `<span style="color:#f5d080">⚠ En período de gracia (${Math.abs(diffDays)} días vencido)</span>`
      : `<span style="color:#e85a5a">✕ Vencido hace ${Math.abs(diffDays)} días</span>`;
  result.className = 'verify-result verify-ok';
  result.innerHTML = `✓ Código válido<br>Estancia: <strong>${data.estancia}</strong> &nbsp;·&nbsp; Vence: <strong>${d}/${m}/${y}</strong><br>${estado}`;
}

async function decodeCode(code) {
  try {
    const p = code.split('-');
    if (p.length !== 6 || p[0] !== 'FT') return null;
    const [_,h1,h2,h3,dateC,est] = p;
    if (dateC.length !== 8 || est.length !== 4) return null;
    const h = await sha256hex(`${est}|${dateC}|${SECRET}`);
    if (h1!==h.slice(0,6)||h2!==h.slice(6,12)||h3!==h.slice(12,16)) return null;
    const fecha = `${dateC.slice(0,4)}-${dateC.slice(4,6)}-${dateC.slice(6,8)}`;
    return { estancia: est, vencimiento: fecha };
  } catch { return null; }
}

// ── History ───────────────────────────────────────────────
function saveHistory(entry) {
  const hist = JSON.parse(localStorage.getItem('tc_gen_history') || '[]');
  hist.unshift(entry);
  localStorage.setItem('tc_gen_history', JSON.stringify(hist.slice(0,50)));
}

function renderHistory() {
  const hist = JSON.parse(localStorage.getItem('tc_gen_history') || '[]');
  const container = document.getElementById('historyContainer');
  if (!hist.length) {
    container.innerHTML = '<div style="font-size:11px;color:var(--text-dim)">Sin códigos generados aún.</div>';
    return;
  }
  container.innerHTML = `<table class="history-table">
    <tr><th>Código</th><th>Estancia</th><th>Vence</th><th>Generado</th></tr>
    ${hist.map(h => {
      const [y,m,d] = h.fecha.split('-');
      const gen = new Date(h.generado).toLocaleDateString('es-PY');
      return `<tr>
        <td>${h.code}</td>
        <td>${h.nombre}</td>
        <td>${d}/${m}/${y}</td>
        <td>${gen}</td>
      </tr>`;
    }).join('')}
  </table>`;
}

function clearHistory() {
  if (confirm('¿Limpiar el historial?')) {
    localStorage.removeItem('tc_gen_history');
    renderHistory();
  }
}

renderHistory();
</script>
</body>
</html>
